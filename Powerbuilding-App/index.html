<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Powerbuilding Log</title>
<meta name="description" content="Training, nutrition and show-prep log">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171B22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Powerbuilding">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0;font-size:14px;font-family:system-ui,-apple-system,sans-serif}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
</head>
<body>
<style>
/* Layout: an app shell. Sticky top bar, two tabs (Workout, Progress) switched from a bottom tab bar.
   Workout = week strip + selected day's exercises, daily rep box tucked in the top-right corner.
   Progress = this week's numbers, an 8-week bar chart, a Mon–Sun grid, and a day-by-day log.
   Push/pull/legs use competition plate colors (25 red, 20 blue, 15 yellow); done = 10 green. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --sunk:#E4E8EE; --ink:#131820; --muted:#5A6373;
  --line:#D6DCE4; --line-strong:#A9B2BF; --accent:#1F55B8; --accent-ink:#FFFFFF;
  --push:#D22B3B; --pull:#1F55B8; --legs:#D9A400; --done:#24834F; --warn:#B4441E;
  --hatch:rgba(19,24,32,.06); --bar:#C9D1DC; --bar-sel:#131820;
  --carb:#C97C0A; --pro:#B5306A; --fat:#23857C;
  --f-display:"Big Shoulders Display","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1116; --surface:#171B22; --sunk:#1F242D; --ink:#E7EBF1; --muted:#929CAC;
  --line:#2A313C; --line-strong:#4A5361; --accent:#6C9BF0; --accent-ink:#0E1116;
  --push:#F0505E; --pull:#6C9BF0; --legs:#F2C232; --done:#3FB977; --warn:#F07C4E;
  --hatch:rgba(231,235,241,.05); --bar:#353D4A; --bar-sel:#E7EBF1; --carb:#F0A63A; --pro:#E86A9E; --fat:#45BFB3; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1116; --surface:#171B22; --sunk:#1F242D; --ink:#E7EBF1; --muted:#929CAC;
  --line:#2A313C; --line-strong:#4A5361; --accent:#6C9BF0; --accent-ink:#0E1116;
  --push:#F0505E; --pull:#6C9BF0; --legs:#F2C232; --done:#3FB977; --warn:#F07C4E;
  --hatch:rgba(231,235,241,.05); --bar:#353D4A; --bar-sel:#E7EBF1; --carb:#F0A63A; --pro:#E86A9E; --fat:#45BFB3; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--surface)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.gutter{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.inner{max-width:1040px;margin:0 auto}

/* App bar */
.appbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.appbar .inner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.markbtn{border:0;background:transparent;padding:0;width:40px;height:40px;border-radius:50%;cursor:pointer;touch-action:pan-y;flex:none;-webkit-tap-highlight-color:transparent}
.markbtn svg{width:100%;height:100%;display:block}
.markbtn.pop svg{animation:mpop .38s ease}
@keyframes mpop{40%{transform:scale(.8) rotate(-10deg)}75%{transform:scale(1.06) rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.markbtn.pop svg{animation:none}}
.wordmark{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em;line-height:1;white-space:nowrap}
.status{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--done)}
.status.saving i{background:var(--legs)}
.status.err i{background:var(--warn)}
@media (max-width:480px){.status>span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.wordmark{font-size:19px}}

main{padding-block:18px calc(96px + env(safe-area-inset-bottom, 0px))}
.tab{display:flex;flex-direction:column;gap:18px}

/* Bottom tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom, 0px)}
.tabbar .inner{display:grid;grid-template-columns:repeat(4,1fr);max-width:640px}
.tabbtn{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;position:relative}
.tabbtn svg{width:24px;height:24px}
.tabbtn[aria-selected="true"]{color:var(--ink)}
.tabbtn[aria-selected="true"]::after{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}

/* Workout header */
.top{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.title-block{display:flex;flex-direction:column;gap:6px;min-width:0;padding-top:2px}
h1,h2.big{font-family:var(--f-display);font-weight:800;font-size:clamp(38px,6.5vw,58px);line-height:.92;margin:0;text-transform:uppercase;text-wrap:balance}
.lede{margin:2px 0 0;color:var(--muted);max-width:52ch}

/* Daily box */
.daily{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px}
.daily-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.streak{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.streak b{color:var(--ink)}
.drow{display:grid;grid-template-columns:46px minmax(0,1fr) 52px 44px;gap:8px;align-items:center}
.dlab{font-family:var(--f-display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.02em;display:flex;align-items:center;gap:4px}
.tick{width:14px;height:14px;border-radius:50%;background:var(--done);display:inline-grid;place-content:center;flex:none}
.tick::before{content:"";width:6px;height:3.5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:translateY(-1px) rotate(-45deg)}
.dbar{position:relative;height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.dbar i{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:5px;transition:width .25s ease}
.dbar b{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--surface);opacity:.9}
.dval{width:100%;text-align:right;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 6px;font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums}
.dinc{border:1px solid var(--line);background:transparent;border-radius:6px;padding:4px 0;font-family:var(--f-mono);font-size:12px;font-weight:600}
.dinc:hover{border-color:var(--c);color:var(--c)}
.daily-foot{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:11px;color:var(--muted)}

.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border:1px dashed var(--line-strong);border-radius:10px;padding:10px 14px;color:var(--muted)}
.banner p{margin:0;max-width:62ch;min-width:0}
.banner .btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.armed,.mini.armed{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.ghost{background:transparent}

/* Week strip */
.week{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(118px,1fr);gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px 10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.chip:hover{border-color:var(--line-strong)}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chip.rest{background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px),var(--surface)}
.chip.optional{border-style:dashed}
.chip .tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:4px}
.chip .nm{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.05;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--done)}
.chip .sub{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.chip.add{align-items:center;justify-content:center;border-style:dashed;color:var(--muted);font-weight:500}

/* Day panel */
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:16px}
.day-head{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;justify-content:space-between}
.day-title{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 280px}
.day-name{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,5vw,42px);line-height:1;text-transform:uppercase;border:0;background:transparent;padding:2px 0;width:100%;border-bottom:2px solid transparent}
.day-name:hover,.day-name:focus{border-bottom-color:var(--line)}
.day-name:focus-visible{outline:none;border-bottom-color:var(--accent)}
.day-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag-input{width:76px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--bg);font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:13px;font-weight:500}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.progress-line{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

.check{display:inline-grid;place-items:center;cursor:pointer}
.check input{appearance:none;-webkit-appearance:none;margin:0;width:24px;height:24px;border:2px solid var(--line-strong);border-radius:6px;background:var(--surface);display:grid;place-content:center;cursor:pointer;transition:background .15s,border-color .15s}
.check input::before{content:"";width:11px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:translateY(-1px) rotate(-45deg);opacity:0}
.check input:checked{background:var(--done);border-color:var(--done)}
.check input:checked::before{opacity:1}
.check.big input{width:28px;height:28px;border-radius:7px}
.check.big input::before{width:13px;height:7px}
.toggle.check{display:inline-flex}
.toggle.check input{width:20px;height:20px;border-radius:5px}
.toggle.check input::before{width:9px;height:5px}

.ex-list{display:flex;flex-direction:column;gap:10px}
.ex{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.ex.is-done{background:color-mix(in srgb,var(--done) 6%,var(--surface))}
.ex-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px}
.ex-name{border:0;background:transparent;font-weight:600;font-size:16px;padding:4px 2px;width:100%;min-width:0;border-bottom:1px solid transparent}
.ex-name:hover,.ex-name:focus{border-bottom-color:var(--line)}
.ex-name:focus-visible{outline:none;border-bottom-color:var(--accent)}
.ex.is-done .ex-name{text-decoration:line-through;text-decoration-color:var(--line-strong);color:var(--muted)}
.ex-sum{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 8px 4px 11px;font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.ex-sum .frac{color:var(--muted)}
.ex-sum svg{width:14px;height:14px;transition:transform .2s}
.ex-sum[aria-expanded="true"] svg{transform:rotate(180deg)}
.sets{border-top:1px solid var(--line);padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.srow{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1fr) 40px 30px;gap:8px;align-items:center}
.srow.head span{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.srow.head span:nth-child(4){text-align:center}
.sn{font-family:var(--f-mono);font-weight:600;font-size:14px;color:var(--muted);text-align:center}
.srow input[type="text"]{width:100%;min-width:0;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg);font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums}
.srow.done input[type="text"]{color:var(--muted)}
.x{border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:6px;font-size:18px;line-height:1}
.x:hover{background:var(--sunk);color:var(--warn)}
.ex-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.ex-note{flex:1 1 200px;min-width:0;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg);font-size:13px}
.mini{border:1px solid var(--line);background:transparent;border-radius:6px;padding:5px 9px;font-size:13px}
.mini:hover:not(:disabled){border-color:var(--line-strong)}
.add-ex{border:1.5px dashed var(--line-strong);background:transparent;border-radius:10px;padding:12px;font-weight:500;color:var(--muted)}
.add-ex:hover{color:var(--ink);border-color:var(--ink)}
.rest-body{display:flex;flex-direction:column;gap:10px}
.rest-body textarea{width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);font-size:15px}
.rest-callout{font-family:var(--f-display);font-weight:700;font-size:22px;text-transform:uppercase;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}
.foot .grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Progress */
.p-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.wknav{display:flex;align-items:center;gap:6px}
.wknav .lbl{font-family:var(--f-mono);font-size:13px;min-width:150px;text-align:center}
.iconbtn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;width:36px;height:36px;display:grid;place-items:center}
.iconbtn svg{width:16px;height:16px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.stat .v small{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted);margin-left:4px}
.delta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.delta.up{color:var(--done)} .delta.down{color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.card h3{font-family:var(--f-display);font-weight:700;font-size:22px;text-transform:uppercase;margin:0;line-height:1}
.chart{position:relative;height:190px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:6px}
.yaxis{position:relative}
.yaxis span{position:absolute;right:0;transform:translateY(50%);font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.plot{position:relative;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;align-items:end;padding-bottom:22px}
.grid-line{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.col{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;border:0;background:transparent;padding:0;z-index:1}
.col .bar{background:var(--bar);border-radius:4px 4px 0 0;min-height:2px;transition:height .3s ease}
.col.sel .bar{background:var(--bar-sel)}
.col .bv{font-family:var(--f-mono);font-size:11px;text-align:center;color:var(--muted);padding-bottom:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.col.sel .bv{color:var(--ink);font-weight:600}
.col .bx{position:absolute;bottom:-20px;left:0;right:0;font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;white-space:nowrap}
.col.sel .bx{color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cell{border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:0;min-height:96px;background:var(--surface)}
.cell.on{background:color-mix(in srgb,var(--done) 9%,var(--surface));border-color:color-mix(in srgb,var(--done) 45%,var(--line))}
.cell.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cell.future{opacity:.5}
.cell .dn{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cell .dn b{color:var(--ink);font-weight:600}
.cell .wo{font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.05;text-transform:uppercase;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cell .sc{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:auto}
.dots{display:flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--c);background:transparent}
.dots i.hit{background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.daylog{display:flex;flex-direction:column}
.dl{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:6px}
.dl:first-child{border-top:0;padding-top:0}
.dl-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:baseline}
.dl-top strong{font-weight:600}
.dl-top .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lines{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr);gap:3px 14px;font-size:14px}
.lines .sets-t{font-family:var(--f-mono);font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.reps-line{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.big3{width:100%;border-collapse:collapse;font-size:14px}
.big3 th{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:0 0 6px}
.big3 th:first-child,.big3 td:first-child{text-align:left}
.big3 td{border-top:1px solid var(--line);padding:9px 0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.big3 td:first-child{font-family:var(--f-display);font-weight:700;font-size:18px;text-transform:uppercase}
.big3 .best{display:block;font-size:11px;color:var(--muted)}
.empty{border:1.5px dashed var(--line-strong);border-radius:10px;padding:18px;color:var(--muted);text-align:center}
.empty strong{display:block;color:var(--ink);margin-bottom:2px}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}
.small{font-size:12px;color:var(--muted)}


/* Nutrition */
.n-top{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.todaycall{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;border:1.5px solid var(--ink);border-radius:10px;padding:12px 14px;background:var(--surface)}
.todaycall .t{font-family:var(--f-display);font-weight:800;font-size:26px;text-transform:uppercase;line-height:1}
.todaycall .m{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.bwcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.bw-in{display:flex;align-items:center;gap:8px}
.bw-in input{width:96px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px;font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums;text-align:right}
.bw-in .u{font-family:var(--f-mono);color:var(--muted)}
.bw-stats{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.bw-stats b{color:var(--ink);font-weight:600}
.spark{width:100%;height:56px;display:block}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mcard.today{box-shadow:inset 0 0 0 1.5px var(--ink);border-color:var(--ink)}
.mc-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mc-head h3{font-family:var(--f-display);font-weight:800;font-size:24px;text-transform:uppercase;margin:0;line-height:1}
.kc{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.kc b{font-family:var(--f-display);font-size:30px;font-weight:800;color:var(--ink);margin-right:3px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 74px 58px 40px;gap:8px;align-items:center}
.mrow.head span{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right}
.mrow.head span:first-child{text-align:left}
.mlab{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.mlab i{width:9px;height:9px;border-radius:2px;background:var(--c);flex:none}
.mrow input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 6px;font-family:var(--f-mono);font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.mrow .r{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.mrow .pc{font-family:var(--f-mono);font-size:13px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.stackbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.stackbar span{background:var(--c);height:100%}
.mc-foot{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.sched{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.sday{border:1px solid var(--line);border-radius:8px;padding:8px 6px;display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:0;text-align:center}
.sday.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.sday .tg{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sday .nm{font-family:var(--f-display);font-weight:700;font-size:14px;text-transform:uppercase;line-height:1.05;min-height:2.1em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lmh{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.lmh button{border:0;background:transparent;font-family:var(--f-mono);font-size:11px;font-weight:600;padding:4px 0}
.lmh button+button{border-left:1px solid var(--line-strong)}
.lmh button[aria-pressed="true"]{background:var(--carb);color:#fff}
.wk-sum{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.wk-sum b{color:var(--ink);font-weight:600}
.micro{width:100%;border-collapse:collapse;font-size:14px}
.micro th{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:0 0 6px 8px}
.micro th:first-child,.micro td:first-child{text-align:left;padding-left:0}
.micro td{border-top:1px solid var(--line);padding:8px 0 8px 8px;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.micro td:first-child{font-family:var(--f-body);font-weight:500;white-space:normal}
.micro td .nt{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:400}
.micro tr.sec td{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:14px;border-top:0}
.tblwrap{overflow-x:auto}
/* 1RM table */
.orm{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;max-width:460px;display:flex;flex-direction:column;gap:6px}
.orm-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px}
.tmpct{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tmpct input{width:48px}
.orm table{width:100%;border-collapse:collapse}
.orm th{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:0 0 4px 6px}
.orm th:first-child{text-align:left;padding-left:0}
.orm td{border-top:1px solid var(--line);padding:4px 0 4px 6px;text-align:right;vertical-align:middle}
.orm td:first-child{text-align:left;padding-left:0}
.orm .ln{font-family:var(--f-display);font-weight:700;font-size:17px;text-transform:uppercase;border:0;background:transparent;width:100%;min-width:0;padding:2px 0}
.orm .ln:focus-visible{outline:none;border-bottom:1px solid var(--accent)}
.orm input.n,.tmpct input,.load input,.load select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 6px;font-family:var(--f-mono);font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.orm input.n{width:78px}
.orm .tm{font-family:var(--f-mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.orm .x{width:24px;height:24px;font-size:16px}
.load{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding-bottom:6px;border-bottom:1px dashed var(--line)}
.load input{width:56px}
.load select{text-align:left;font-family:var(--f-body);font-size:13px;color:var(--ink)}
.load .calc{font-family:var(--f-mono);font-size:14px;font-weight:600;color:var(--ink)}
.srow input.auto{color:var(--accent)}
/* Last time */
.last{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 8px;padding:2px 0 4px}
.last b{color:var(--ink);font-weight:600}
/* Prep */
.cd{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.cd .big2{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,8vw,64px);line-height:.9;text-transform:uppercase;font-variant-numeric:tabular-nums}
.cd .sub2{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.setup{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld input,.fld select{border:1px solid var(--line-strong);background:var(--bg);border-radius:6px;padding:6px 8px;font-family:var(--f-mono);font-size:14px;color:var(--ink);min-width:0}
.fld input.w{width:96px;text-align:right}
.pill{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--c);border-radius:999px;padding:3px 10px;font-weight:600;font-size:13px}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.advice{border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 8%,var(--surface));border-radius:0 8px 8px 0;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.advice p{margin:0;max-width:62ch;min-width:0}
.wchart{width:100%;display:block}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{position:relative;aspect-ratio:3/4;max-width:100%;border:1.5px dashed var(--line-strong);border-radius:8px;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot img.broken{display:none}
.slot .lab{position:absolute;left:6px;top:6px;font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:var(--surface);color:var(--ink);border-radius:4px;padding:1px 5px;z-index:1}
.slot .add{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:500;width:100%;height:100%}
.slot .rm{position:absolute;right:4px;top:4px;z-index:1;border:0;border-radius:50%;width:26px;height:26px;background:var(--surface);color:var(--ink);font-size:15px;line-height:1}
.slot .rm.armed{background:var(--warn);color:#fff}
.slot.busy::after{content:"Uploading…";position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--surface) 80%,transparent);font-family:var(--f-mono);font-size:12px}
.cilist{display:flex;flex-direction:column}
.ci{border-top:1px solid var(--line);padding:10px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.ci:first-child{border-top:0}
.ci .thumbs{display:flex;gap:4px}
.ci .thumbs img,.ci .thumbs span{width:40px;height:52px;border-radius:4px;object-fit:cover;background:var(--sunk);display:block}
.ci .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ci strong{font-weight:600}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp figure{margin:0;display:flex;flex-direction:column;gap:4px}
.cmp .slot{border-style:solid}
.cmp figcaption{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.cardio-row{display:grid;grid-template-columns:minmax(0,1fr) 80px 30px;gap:6px;align-items:center}
.cardio-row select,.cardio-row input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px;font-size:14px;color:var(--ink);min-width:0}
.cardio-row input{font-family:var(--f-mono);text-align:right}
.act7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
textarea.ci-notes{width:100%;min-height:54px;resize:vertical;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg);font-size:14px}
@media (max-width:720px){ .rate{grid-template-columns:repeat(2,minmax(0,1fr))} .act7{gap:3px} }
/* Daily check */
.dnav{display:flex;align-items:center;gap:6px}
.dnav .lbl{font-family:var(--f-mono);font-size:13px;min-width:92px;text-align:center}
.bio{display:flex;flex-direction:column;gap:8px}
.bio-row{display:grid;grid-template-columns:124px minmax(0,1fr);gap:10px;align-items:center}
.bio-row .bl{display:flex;flex-direction:column;line-height:1.2}
.bio-row .bl b{font-weight:600;font-size:14px}
.bio-row .bl span{font-size:11px;color:var(--muted)}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.scale button{border:0;background:transparent;padding:8px 0;font-family:var(--f-mono);font-weight:600;font-size:14px}
.scale button+button{border-left:1px solid var(--line-strong)}
.scale button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pose{display:flex;flex-direction:column;gap:10px}
.pose-in{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pose-in input{width:72px;border:1px solid var(--line-strong);background:var(--bg);border-radius:6px;padding:6px 8px;font-family:var(--f-mono);font-size:16px;text-align:right}
.stat-line{display:flex;flex-wrap:wrap;gap:4px 16px;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.stat-line b{color:var(--ink);font-weight:600}
/* Strength trend */
.lifts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lift{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0;align-self:start}
.lift-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lift-top h4{font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase;margin:0;line-height:1}
.lift-top .v{font-family:var(--f-mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.mline{display:block;width:100%}
.adh7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
@media (max-width:720px){ .lifts{grid-template-columns:minmax(0,1fr)} .bio-row{grid-template-columns:96px minmax(0,1fr)} .adh7{gap:3px} }
/* Sign-in gate */
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:auto;padding-block:24px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.gate-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px}
.gate-brand{display:flex;align-items:center;gap:12px}
.gate-brand svg{width:60px;height:60px;flex:none}
.gate-brand b{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:.95;text-transform:uppercase}
.gate label{display:flex;flex-direction:column;gap:4px}
.gate input{border:1px solid var(--line-strong);background:var(--bg);border-radius:8px;padding:10px 12px;font-size:16px;color:var(--ink)}
.gate .row{display:flex;gap:8px;flex-wrap:wrap}
.gate .row .btn{flex:1 1 140px;padding:10px 12px}
.gate p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.gate .msg{color:var(--warn)}
.gate .msg.ok{color:var(--done)}
.linkbtn{border:0;background:transparent;color:var(--muted);text-decoration:underline;padding:0;font-size:13px;align-self:flex-start}
.fs-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fs-item{border:0;border-top:1px solid var(--line);background:var(--surface);text-align:left;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.fs-item:first-child{border-top:0}
.fs-item:hover{background:var(--bg)}
.fs-item b{font-weight:600;font-size:14px}
.fs-item span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.dtype{display:inline-block;padding:1px 7px;border-radius:999px;border:1px solid var(--line-strong);font-size:11px;margin-left:4px}
/* Food search */
.fs{background:var(--surface);border:1.5px solid var(--ink);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.fs-form{display:flex;gap:8px}
.fs-input{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:10px;background:var(--bg);padding:0 12px}
.fs-input svg{width:18px;height:18px;color:var(--muted);flex:none}
.fs-input input{flex:1;min-width:0;border:0;background:transparent;padding:11px 0;font-size:16px}
.fs-input input:focus-visible{outline:none}
.fs-input:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.qchip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:13px;color:var(--muted)}
.qchip:hover{color:var(--ink);border-color:var(--line-strong)}
.fs-res{display:flex;flex-direction:column;gap:12px}
.fs-name{font-family:var(--f-display);font-weight:800;font-size:26px;text-transform:uppercase;line-height:1;margin:0;text-wrap:balance}
.fs-meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.conf{display:inline-block;padding:1px 7px;border-radius:999px;border:1px solid currentColor;font-size:11px;margin-left:4px}
.conf.high{color:var(--done)} .conf.medium{color:var(--legs)} .conf.low{color:var(--warn)}
.amt{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.amt input{width:84px;border:1px solid var(--line-strong);background:var(--bg);border-radius:6px;padding:6px 8px;font-family:var(--f-mono);font-size:15px;text-align:right}
.addrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.addrow select{border:1px solid var(--line-strong);background:var(--bg);border-radius:6px;padding:6px 8px;font:inherit;color:inherit}
.fs-note{font-size:12px;color:var(--muted);margin:0}
.thinking{font-family:var(--f-mono);font-size:13px;color:var(--muted);display:flex;align-items:center;gap:10px}
.thinking i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
/* Food log */
.fl-head{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.fl-date{display:flex;align-items:center;gap:6px}
.fl-date .lbl{font-family:var(--f-display);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1;min-width:0}
.fl-type{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.tots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tot{display:flex;flex-direction:column;gap:4px;min-width:0}
.tot .lab{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tot .lab i{width:9px;height:9px;border-radius:2px;background:var(--c)}
.tot .val{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.tot .val small{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted);margin-left:3px}
.tbar{position:relative;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.tbar i{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:4px;transition:width .25s}
.tot .left{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tot .left.over{color:var(--warn)}
.meals{display:flex;flex-direction:column;gap:10px}
.meal{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.meal-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meal-name{flex:1 1 140px;min-width:0;border:0;border-bottom:1px solid transparent;background:transparent;font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase;padding:2px 0}
.meal-name:hover,.meal-name:focus{border-bottom-color:var(--line)}
.meal-name:focus-visible{outline:none;border-bottom-color:var(--accent)}
.meal-sum{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}

<script>
(function(){
"use strict";
const LS_PLAN="pbl.plan.v1", LS_DAILY="pbl.daily.v1", LS_SEL="pbl.sel", LS_LOG="pbl.log.v1", LS_TAB="pbl.tab", LS_METRIC="pbl.metric", LS_NUT="pbl.nut.v1", LS_MEALS="pbl.meals.v1";
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls={get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const clone=o=>JSON.parse(JSON.stringify(o));

function ex(name,sets,reps){return{id:uid(),name,note:"",open:false,sets:Array.from({length:sets},()=>({reps:String(reps),weight:"",done:false}))}}
function day(tag,name,type,optional,exs,notes){return{id:uid(),tag,name,type,optional:!!optional,notes:notes||"",exercises:(exs||[]).map(a=>ex(a[0],a[1],a[2]))}}
function samplePlan(){return{unit:"kg",example:true,days:[
  day("Mon","Squat + Quads","train",0,[["Back squat",4,5],["Pause squat",3,6],["Leg press",3,10],["Leg extension",3,12],["Standing calf raise",4,12]]),
  day("Tue","Bench + Push","train",0,[["Bench press",4,5],["Overhead press",3,8],["Incline DB press",3,10],["Cable fly",3,12],["Triceps pushdown",3,12]]),
  day("Wed","Rest","rest",0,[],"Walk 30 min, hip and t-spine mobility, 8 hours of sleep."),
  day("Thu","Deadlift + Pull","train",0,[["Deadlift",3,4],["Barbell row",4,8],["Lat pulldown",3,10],["Face pull",3,15],["Hammer curl",3,10]]),
  day("Fri","OHP + Upper","train",0,[["Overhead press",4,5],["Close-grip bench",3,8],["Weighted pull-up",3,6],["Chest-supported row",3,10],["Lateral raise",4,15]]),
  day("Sat","Lower Volume","train",0,[["Romanian deadlift",3,8],["Front squat",3,6],["Bulgarian split squat",3,10],["Leg curl",3,12],["Hanging leg raise",3,12]]),
  day("Sun","Arms + Weak Points","train",1,[["EZ-bar curl",3,12],["Overhead triceps extension",3,12],["Rear delt fly",3,15]])
]}}
function blankPlan(){const t=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const mk=(i,type,opt)=>day(t[i],"",type,opt,type==="train"?[["",3,""]]:[],"");
  return{unit:plan?plan.unit:"kg",example:false,days:[mk(0,"train"),mk(1,"train"),mk(2,"rest"),mk(3,"train"),mk(4,"train"),mk(5,"train"),mk(6,"train",1)]}}

let plan=ls.get(LS_PLAN)||samplePlan();
function defaultOrm(){return{tmPct:90,lifts:[{id:"squat",name:"Squat",v:""},{id:"bench",name:"Bench",v:""},{id:"deadlift",name:"Deadlift",v:""},{id:"ohp",name:"OHP",v:""}]}}
function ensureOrm(){if(!plan.orm||!Array.isArray(plan.orm.lifts))plan.orm=defaultOrm();if(plan.orm.tmPct==null)plan.orm.tmPct=90}
ensureOrm();
let daily=ls.get(LS_DAILY)||{log:{}}; daily.log=daily.log||{};
let log=ls.get(LS_LOG)||{};
let sel=ls.get(LS_SEL);
let tab=["progress","nutrition","prep"].includes(ls.get(LS_TAB))?ls.get(LS_TAB):"workout";
function defaultNut(){return{example:true,sex:"",types:{low:{c:150,p:180,f:75},med:{c:250,p:180,f:65},high:{c:350,p:180,f:55}},schedule:{},bw:{}}}
let nut=ls.get(LS_NUT)||defaultNut(); nut.bw=nut.bw||{}; nut.schedule=nut.schedule||{};
let meals=ls.get(LS_MEALS)||{}; let mealDate=null; let mealArmed=null, mealTimer=null;
function normDay(en){if(!en||!Array.isArray(en.meals))return en;en.meals.forEach(m=>{if(Array.isArray(m.items)){if(m.c==null&&m.p==null&&m.f==null){let c=0,p=0,f=0;m.items.forEach(it=>{c+=+it.c||0;p+=+it.p||0;f+=+it.f||0});m.c=c||"";m.p=p||"";m.f=f||""}delete m.items}["c","p","f"].forEach(q=>{if(m[q]==null)m[q]=""})});return en}
const mealHas=m=>!!((+m.c||0)||(+m.p||0)||(+m.f||0));
for(const k in meals)normDay(meals[k]);
let metric=ls.get(LS_METRIC)||"sets";
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const todayTag=DOW[new Date().getDay()];
if(!plan.days.some(d=>d.id===sel)){const m=plan.days.find(d=>(d.tag||"").toLowerCase()===todayTag.toLowerCase());sel=(m||plan.days[0]).id}
let armed=null, armedTimer=null;

/* ---------- dates ---------- */
function dateKey(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0")}
function parseKey(k){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(dt,n){const d=new Date(dt);d.setDate(d.getDate()+n);return d}
function mondayOf(dt){const d=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate());const off=(d.getDay()+6)%7;return addDays(d,-off)}
const fmtShort=dt=>dt.toLocaleDateString(undefined,{month:"short",day:"numeric"});
const todayKey=()=>dateKey(new Date());
let weekSel=dateKey(mondayOf(new Date()));

/* ---------- storage ---------- */
let refs=null;
function setStatus(kind,text){const el=document.getElementById("status");el.className="status"+(kind?" "+kind:"");el.lastElementChild.textContent=text}
async function writeRef(ref,val,del){
  try{ if(del) await ref.delete(); else await ref.set(clone(val)); return true }
  catch(e){
    if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{if(del)await ref.delete();else await ref.set(clone(val));return true}catch(e2){}}
    return false;
  }
}
function makeSaver(lsKey,getVal,getRef){
  const s={timer:null,busy:false,again:false};
  s.schedule=function(){ls.set(lsKey,getVal());setStatus("saving","Saving…");clearTimeout(s.timer);s.timer=setTimeout(s.flush,700)};
  s.flush=async function(){s.timer=null;
    if(!refs){setStatus("","Saved on this device");return}
    if(s.busy){s.again=true;return}
    s.busy=true;
    const ok=await writeRef(getRef(),getVal());s.failed=!ok;
    setStatus(ok?"":"err",ok?"Saved to your account":"Offline · saved on this device, will sync later");
    s.busy=false; if(s.again){s.again=false;s.flush()}
  };
  s.pending=()=>!!s.timer||s.busy;
  return s;
}
const planSaver=makeSaver(LS_PLAN,()=>plan,()=>refs.plan);
const dailySaver=makeSaver(LS_DAILY,()=>daily,()=>refs.daily);
const nutSaver=makeSaver(LS_NUT,()=>nut,()=>refs.nutrition);
const LS_PREP="pbl.prep.v1";
function defaultPrep(){return{showDate:"",targetW:"",startDate:"",startKg:0,stepTarget:10000,cardioTarget:150,checkins:[],activity:{},lastAdjust:"",posing:{},posingTarget:15,bio:{}}}
function normPrep(p){const d=defaultPrep();p=p&&typeof p==="object"?p:{};for(const k in d)if(p[k]==null)p[k]=d[k];if(!Array.isArray(p.checkins))p.checkins=[];if(typeof p.activity!=="object")p.activity={};if(typeof p.posing!=="object")p.posing={};if(typeof p.bio!=="object")p.bio={};p.checkins.forEach(c=>{c.photos=c.photos||{}});return p}
let prep=normPrep(ls.get(LS_PREP));
const prepSaver=makeSaver(LS_PREP,()=>prep,()=>refs.prep);
const mealDirty=new Set(); let mealSaveTimer=null, mealBusy=false;
function scheduleMeals(k){mealDirty.add(k);ls.set(LS_MEALS,meals);setStatus("saving","Saving…");clearTimeout(mealSaveTimer);mealSaveTimer=setTimeout(flushMeals,700)}
async function flushMeals(){mealSaveTimer=null;
  if(!refs){mealDirty.clear();setStatus("","Saved on this device");return}
  if(mealBusy)return; mealBusy=true; let ok=true;
  const fail=[];
  while(mealDirty.size){const k=mealDirty.values().next().value;mealDirty.delete(k);const en=meals[k];
    const empty=!en||!en.meals.some(mealHas)&&!en.type;
    const ok1=await writeRef(refs.mealsCol.doc(k),en,empty);if(!ok1)fail.push(k);ok=ok&&ok1;}
  mealBusy=false; fail.forEach(k=>mealDirty.add(k)); if(!fail.length&&mealDirty.size)return flushMeals();
  setStatus(ok?"":"err",ok?"Saved to your account":"Offline · saved on this device, will sync later");
}
/* history: one document per date */
const logDirty=new Set(); let logTimer=null, logBusy=false;
function scheduleLog(k){logDirty.add(k);ls.set(LS_LOG,log);setStatus("saving","Saving…");clearTimeout(logTimer);logTimer=setTimeout(flushLog,700)}
async function flushLog(){logTimer=null;
  if(!refs){logDirty.clear();setStatus("","Saved on this device");return}
  if(logBusy)return; logBusy=true;
  let ok=true;
  const fail=[];
  while(logDirty.size){const k=logDirty.values().next().value;logDirty.delete(k);
    const en=log[k]; const empty=!en||!Object.keys(en.sets||{}).length;
    const ok1=await writeRef(refs.logCol.doc(k),en,empty);if(!ok1)fail.push(k);ok=ok&&ok1;}
  logBusy=false; fail.forEach(k=>logDirty.add(k));
  setStatus(ok?"":"err",ok?"Saved to your account":"Offline · saved on this device, will sync later");
}

/* ---------- cloud sync (Supabase) ---------- */
const CFG=window.PBL_CONFIG||{};
let sb=null, sbUser=null;
const cfgOk=v=>typeof v==="string"&&v.length>10&&!/^YOUR_/.test(v);
function cloudConfigured(){return !!(window.supabase&&cfgOk(CFG.supabaseUrl)&&cfgOk(CFG.supabaseAnonKey))}
function sbErr(e){const x=new Error((e&&e.message)||"Request failed");x.code=(!navigator.onLine||/fetch|network|load failed/i.test(x.message))?"unavailable":"failed";return x}
function sbDoc(path){return{
  async get(){const r=await sb.from("docs").select("data").eq("user_id",sbUser.id).eq("path",path).maybeSingle();if(r.error)throw sbErr(r.error);return{exists:!!r.data,data:()=>r.data?r.data.data:undefined}},
  async set(v){const r=await sb.from("docs").upsert({user_id:sbUser.id,path,data:v,updated_at:new Date().toISOString()},{onConflict:"user_id,path"});if(r.error)throw sbErr(r.error)},
  async delete(){const r=await sb.from("docs").delete().eq("user_id",sbUser.id).eq("path",path);if(r.error)throw sbErr(r.error)}}}
function sbCol(prefix){const q={doc:k=>sbDoc(prefix+"/"+k),orderBy:()=>({limit:n=>({async get(){const r=await sb.from("docs").select("data").eq("user_id",sbUser.id).like("path",prefix+"/%").order("path",{ascending:false}).limit(n);if(r.error)throw sbErr(r.error);return{docs:(r.data||[]).map(x=>({data:()=>x.data}))}}})})};return q}
async function connect(){
  if(!sb||!sbUser){setStatus("","Saved on this device");return}
  refs={plan:sbDoc("plan"),daily:sbDoc("daily"),nutrition:sbDoc("nutrition"),prep:sbDoc("prep"),logCol:sbCol("log"),mealsCol:sbCol("meals")};
  setStatus("saving","Syncing…");
  await pull(true);
  setStatus(navigator.onLine?"":"err",navigator.onLine?"Synced":"Offline · will sync later");
}
function flushAll(){if(!refs)return;[planSaver,dailySaver,nutSaver,prepSaver].forEach(x=>{if(x.failed&&!x.pending())x.flush()});if(logDirty.size&&!logTimer)flushLog();if(mealDirty.size&&!mealSaveTimer)flushMeals()}
window.addEventListener("online",()=>{flushAll();pull(false)});
const LS_LOCAL="pbl.localOnly";
function gateHTML(mode,msg,ok){
  const m='<svg viewBox="0 0 100 100" aria-hidden="true">'+MASCOTS[curMascot()].svg+'</svg>';
  let h='<div class="gate-card"><div class="gate-brand">'+m+'<b>Powerbuilding<br>Log</b></div>';
  if(mode==="setup"){
    h+='<p><strong style="color:var(--ink)">Almost there.</strong> Add your Supabase project URL and key to <code>config.js</code>, upload it, then reload this page. The setup guide (SETUP.md) shows where to find them.</p>'+
      '<button class="linkbtn" data-g="local">Use on this device only for now (no syncing)</button>';
  }else{
    h+='<p>Sign in to sync your training, food and prep logs between your phone and computer.</p>'+
      '<form id="gate-form" class="bio"><label><span class="eyebrow">Email</span><input id="g-email" type="email" autocomplete="email" required></label>'+
      '<label><span class="eyebrow">Password</span><input id="g-pass" type="password" autocomplete="current-password" minlength="6" required></label>'+
      '<div class="row"><button class="btn primary" type="submit" data-g="in">Sign in</button><button class="btn" type="button" data-g="up">Create account</button></div></form>'+
      (msg?'<p class="msg'+(ok?" ok":"")+'">'+esc(msg)+'</p>':'')+
      '<button class="linkbtn" data-g="local">Use on this device only (no syncing)</button>';
  }
  return h+'</div>'}
function showGate(mode,msg,ok){const g=document.getElementById("gate");const em=document.getElementById("g-email");const keep=em?em.value:"";g.innerHTML=gateHTML(mode,msg,ok);g.hidden=false;const e2=document.getElementById("g-email");if(e2&&keep)e2.value=keep}
function hideGate(){document.getElementById("gate").hidden=true}
async function gateAuth(kind){
  const email=(document.getElementById("g-email")||{}).value||"", pass=(document.getElementById("g-pass")||{}).value||"";
  if(!email||pass.length<6){showGate("signin","Enter your email and a password of at least 6 characters.");return}
  try{
    if(kind==="up"){const r=await sb.auth.signUp({email,password:pass});if(r.error)throw r.error;if(!r.data.session){showGate("signin","Account created. Check your email to confirm it, then sign in here.",true);return}onSignedIn(r.data.session.user)}
    else{const r=await sb.auth.signInWithPassword({email,password:pass});if(r.error)throw r.error;onSignedIn(r.data.user)}
  }catch(e){showGate("signin",(e&&e.message)?e.message.replace(/\.$/,"")+".":"Couldn't sign in. Check your connection and try again.")}
}
function onSignedIn(user){if(!user)return;const first=!sbUser;sbUser=user;try{localStorage.removeItem(LS_LOCAL)}catch(e){}hideGate();if(first)connect();if(tab==="progress")renderProgress();if(tab==="prep")renderPrep()}
document.getElementById("gate").addEventListener("click",ev=>{const b=ev.target.closest("[data-g]");if(!b)return;
  if(b.dataset.g==="local"){ev.preventDefault();ls.set(LS_LOCAL,true);hideGate();setStatus("","Saved on this device")}
  else if(b.dataset.g==="up"){ev.preventDefault();gateAuth("up")}});
document.getElementById("gate").addEventListener("submit",ev=>{ev.preventDefault();gateAuth("in")});
async function signOut(){try{await sb.auth.signOut()}catch(e){}

async function boot(){
  if(!cloudConfigured()){if(ls.get(LS_LOCAL)){setStatus("","Saved on this device");return}showGate("setup");return}
  sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:"pbl-auth"}});
  sb.auth.onAuthStateChange((ev,session)=>{if(ev==="SIGNED_OUT"){sbUser=null;refs=null}else if(session&&session.user&&!sbUser){onSignedIn(session.user)}});
  let session=null;try{const r=await sb.auth.getSession();session=r.data&&r.data.session}catch(e){}
  if(session&&session.user){onSignedIn(session.user)}
  else if(ls.get(LS_LOCAL)){setStatus("","Saved on this device")}
  else showGate("signin");
}
async function pull(first){
  if(!refs)return;
  const editing=document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName);
  try{
    const [p,d,q,nn,pp]=await Promise.all([refs.plan.get(),refs.daily.get(),refs.logCol.orderBy("date","desc").limit(500).get(),refs.nutrition.get(),refs.prep.get()]);
    if(pp.exists&&!prepSaver.pending()&&!(editing&&!first)){const v=pp.data();if(v&&JSON.stringify(v)!==JSON.stringify(prep)){prep=normPrep(clone(v));ls.set(LS_PREP,prep);if(tab==="prep")renderPrep()}}
    else if(!pp.exists&&first&&(prep.showDate||prep.checkins.length||Object.keys(prep.activity).length)){prepSaver.schedule()}
    try{const mq=await refs.mealsCol.orderBy("date","desc").limit(120).get();const rm={};mq.docs.forEach(x=>{const v=x.data();if(v&&v.date)rm[v.date]=normDay(clone(v))});
      let mc=false;for(const k in rm){if(mealDirty.has(k))continue;if(editing&&!first&&k===mealDate)continue;if(JSON.stringify(rm[k])!==JSON.stringify(meals[k])){meals[k]=rm[k];mc=true}}
      if(first){for(const k in meals){if(!rm[k]&&meals[k].meals&&meals[k].meals.some(mealHas))scheduleMeals(k)}}
      if(mc){ls.set(LS_MEALS,meals);if(tab==="nutrition")renderNutrition()}}catch(e){}
    if(nn.exists&&!nutSaver.pending()&&!(editing&&!first)){const v=nn.data();if(v&&v.types&&JSON.stringify(v)!==JSON.stringify(nut)){nut=clone(v);nut.bw=nut.bw||{};nut.schedule=nut.schedule||{};ls.set(LS_NUT,nut);if(tab==="nutrition")renderNutrition()}}
    else if(!nn.exists&&first&&!nut.example){nutSaver.schedule()}
    if(p.exists&&!planSaver.pending()&&!(editing&&!first)){
      const v=p.data(); if(v&&Array.isArray(v.days)&&JSON.stringify(v)!==JSON.stringify(plan)){plan=clone(v);ensureOrm();ls.set(LS_PLAN,plan);if(!plan.days.some(x=>x.id===sel))sel=plan.days[0]&&plan.days[0].id;renderWorkout()}
    } else if(!p.exists&&first){planSaver.schedule()}
    if(d.exists&&!dailySaver.pending()){
      const v=d.data(); if(v&&v.log&&JSON.stringify(v)!==JSON.stringify(daily)){daily=clone(v);ls.set(LS_DAILY,daily);renderDaily()}
    } else if(!d.exists&&first&&Object.keys(daily.log).length){dailySaver.schedule()}
    const remote={}; q.docs.forEach(s=>{const v=s.data();if(v&&v.date)remote[v.date]=clone(v)});
    let changed=false;
    for(const k in remote){if(logDirty.has(k))continue;if(JSON.stringify(remote[k])!==JSON.stringify(log[k])){log[k]=remote[k];changed=true}}
    if(first){for(const k in log){if(!remote[k]&&Object.keys(log[k].sets||{}).length)scheduleLog(k)}}
    if(changed){ls.set(LS_LOG,log);if(tab==="progress")renderProgress()}
  }catch(e){}
}

/* ---------- plan helpers ---------- */
const curDay=()=>plan.days.find(d=>d.id===sel)||plan.days[0];
function findEx(id){for(const d of plan.days){const e=d.exercises.find(x=>x.id===id);if(e)return{d,e}}return{}}
const LIFT_TESTS={squat:n=>/squat/i.test(n)&&!/split|bulgarian|goblet|hack|pause/i.test(n),bench:n=>/bench/i.test(n)&&!/close|incline|decline/i.test(n),deadlift:n=>/deadlift/i.test(n)&&!/romanian|rdl|stiff/i.test(n),ohp:n=>/overhead press|\bohp\b|military press|strict press/i.test(n)};
function detectLift(name){name=name||"";for(const L of plan.orm.lifts){const t=LIFT_TESTS[L.id];if(t?t(name):(L.name&&name.toLowerCase().includes(L.name.toLowerCase())))return L.id}
  for(const L of plan.orm.lifts){const base={squat:/squat/i,bench:/bench/i,deadlift:/deadlift/i}[L.id];if(base&&base.test(name))return L.id}return""}
function liftOf(e){const id=e.lift==="none"?"":(e.lift||detectLift(e.name));return plan.orm.lifts.find(L=>L.id===id)||null}
const stepOf=()=>plan.unit==="lb"?5:2.5;
function tmOf(L){const v=parseFloat(L.v);return v>0?v*(+plan.orm.tmPct||0)/100:0}
function roundLoad(w){const st=stepOf();return Math.round(w/st)*st}
function loadFor(e){const pct=parseFloat(e.pct);if(!(pct>0))return null;const L=liftOf(e);if(!L)return null;const base=e.base==="1rm"?parseFloat(L.v):tmOf(L);if(!(base>0))return null;return roundLoad(base*pct/100)}
const fmtW=w=>String(Math.round(w*100)/100);
function applyLoad(e){const w=loadFor(e);if(w==null)return;e.sets.forEach(s=>{if(s.weight===""||s.auto){s.weight=fmtW(w);s.auto=true}})}
function applyAllLoads(){plan.days.forEach(d=>d.exercises.forEach(applyLoad))}
function exSummary(e){const n=e.sets.length;if(!n)return"No sets";const r=e.sets.map(s=>String(s.reps).trim()||"–");
  const pc=parseFloat(e.pct)>0?" · "+e.pct+"% "+(e.base==="1rm"?"1RM":"TM"):"";
  return (r.every(x=>x===r[0])?n+" × "+r[0]:n+" sets · "+r.join("/"))+pc}
function dayStats(d){let t=0,c=0;d.exercises.forEach(e=>e.sets.forEach(s=>{t++;if(s.done)c++}));return{t,c}}
function dayLabel(d){if(d.type==="rest")return"Rest";let n=0;for(const x of plan.days){if(x.type==="train")n++;if(x===d)break}return"Day "+n+(d.optional?" · opt":"")}
function arm(key){armed=key;clearTimeout(armedTimer);armedTimer=setTimeout(()=>{armed=null;renderWorkout()},4000)}
function todayEntry(){return daily.log[todayKey()]||{push:0,pull:0,legs:0}}

/* ---------- history logging ---------- */
function logSet(d,e,i,on){
  const k=todayKey(), key=e.id+":"+i, s=e.sets[i]; if(!s)return;
  const en=log[k]||{date:k,sets:{}};
  if(on){en.sets[key]={d:d.name||dayLabel(d),e:e.name||"Exercise",r:String(s.reps||""),w:String(s.weight||""),u:plan.unit,i:i,t:Date.now()}}
  else if(en.sets[key]){delete en.sets[key]}
  else return;
  log[k]=en; scheduleLog(k);
}
function syncLogged(e,i){ // reps/weight/name edited after ticking today
  const k=todayKey(), en=log[k]; if(!en)return;
  let hit=false;
  e.sets.forEach((s,j)=>{const r=en.sets[e.id+":"+j];if(r&&(i==null||i===j)){r.r=String(s.reps||"");r.w=String(s.weight||"");r.e=e.name||"Exercise";hit=true}});
  if(hit)scheduleLog(k);
}

const isGoal=e=>!!e&&(+e.push||0)>=50&&(+e.pull||0)>=50&&(+e.legs||0)>=50;

let LT={};

  return idx}

document.addEventListener("error",ev=>{const t=ev.target;if(t&&t.tagName==="IMG"&&t.dataset&&t.dataset.ph)t.classList.add("broken")},true);
let rzT=null; window.addEventListener("resize",()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(tab==="prep")rerender(renderPrep);if(tab==="progress")renderProgress()},200)});

/* ---------- tabs ---------- */
function showTab(t){
  tab=t; ls.set(LS_TAB,t);
  document.getElementById("tab-workout").hidden=t!=="workout";
  document.getElementById("tab-progress").hidden=t!=="progress";
  document.getElementById("tab-nutrition").hidden=t!=="nutrition";
  document.getElementById("tab-prep").hidden=t!=="prep";
  if(t==="prep")renderPrep();
  if(t==="nutrition")renderNutrition();
  document.querySelectorAll(".tabbtn").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===t)));
  if(t==="progress")renderProgress();
  window.scrollTo({top:0});
}
document.querySelector(".tabbar").addEventListener("click",ev=>{const b=ev.target.closest(".tabbtn");if(b)showTab(b.dataset.tab)});

/* ---------- events ---------- */
const app=document.getElementById("app");
app.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]"); if(!b||b.disabled)return;
  const act=b.dataset.act, d=curDay(), exId=b.dataset.ex;
  const {e}=exId?findEx(exId):{};
  const confirm2=(key,fn)=>{if(armed===key){armed=null;clearTimeout(armedTimer);fn();return true}arm(key);renderWorkout();return false};
  switch(act){
    case "load-del": e.noLoad=true; e.pct=""; e.sets.forEach(s=>{s.auto=false}); break;
    case "load-add": e.noLoad=false; break;
    case "orm-add": {const L={id:"l"+uid(),name:"",v:""};plan.orm.lifts.push(L);planSaver.schedule();renderWorkout();const n=document.getElementById("ormn-"+L.id);n&&n.focus();return}
    case "orm-del": plan.orm.lifts=plan.orm.lifts.filter(x=>x.id!==b.dataset.id); planSaver.schedule(); renderWorkout(); return;
    case "pr-restart": {const kg=avgAt(todayKey())||latestBwKg();if(!kg)return;prep.startDate=todayKey();prep.startKg=kg;prepSaver.schedule();renderPrep();return}
    case "pr-adjust": {const T=nut.types;if(b.dataset.v==="down"){T.med.c=Math.max(0,(+T.med.c||0)-25);T.high.c=Math.max(0,(+T.high.c||0)-25)}else{T.high.c=(+T.high.c||0)+25}
      nut.example=false;prep.lastAdjust=todayKey();prepMsg="Carb targets updated on the Nutrition tab.";nutSaver.schedule();prepSaver.schedule();renderPrep();return}
    case "ci-pick": {const f=document.getElementById("ci-file-"+b.dataset.pose);if(f)f.click();return}
    case "ci-rm": {const tk=todayKey(),k=tk+b.dataset.pose;if(photoArmed!==k){photoArmed=k;clearTimeout(photoTimer);photoTimer=setTimeout(()=>{photoArmed=null;if(tab==="prep")renderPrep()},4000);renderPrep();return}
      photoArmed=null;const ci=ciFor(tk,false);if(!ci)return;const id=ci.photos[b.dataset.pose];delete ci.photos[b.dataset.pose];prepSaver.schedule();renderPrep();if(id&&photosOn()&&String(id).includes("/"))sb.storage.from(BUCKET).remove([id]).catch(()=>{});return}
    case "act-go": actDate=b.dataset.v; renderPrep(); return;
    case "day-prev": actDate=dateKey(addDays(parseKey(actDate||todayKey()),-1)); renderPrep(); return;
    case "day-next": {const n=dateKey(addDays(parseKey(actDate||todayKey()),1));if(n<=todayKey())actDate=n;renderPrep();return}
    case "bio": {const k=actDate||todayKey();const B=prep.bio[k]||(prep.bio[k]={});const v=+b.dataset.v;if(+B[b.dataset.k]===v)delete B[b.dataset.k];else B[b.dataset.k]=v;if(!Object.keys(B).length)delete prep.bio[k];
      const ks=Object.keys(prep.bio).sort();while(ks.length>180)delete prep.bio[ks.shift()];prepSaver.schedule();renderPrep();return}
    case "pose-add": {const k=actDate||todayKey();prep.posing[k]=Math.min(600,(+prep.posing[k]||0)+(+b.dataset.v));const ks=Object.keys(prep.posing).sort();while(ks.length>180)delete prep.posing[ks.shift()];prepSaver.schedule();renderPrep();return}
    case "backup-save": saveBackup(); return;
    case "sign-out": signOut(); return;
    case "sign-in": try{localStorage.removeItem(LS_LOCAL)}catch(e){} showGate("signin"); return;
    case "restore-pick": {const f=document.getElementById("restore-file");if(f)f.click();return}
    case "restore-apply": applyBackup(); return;
    case "restore-cancel": restoreData=null; renderProgress(); return;
    case "act-add": {const a=actFor(actDate||todayKey());const c={id:uid(),t:"Incline walk",m:""};a.cardio.push(c);prepSaver.schedule();renderPrep();const n=document.getElementById("cm-"+c.id);n&&n.focus();return}
    case "act-del": {const a=actFor(actDate||todayKey());a.cardio=a.cardio.filter(x=>x.id!==b.dataset.id);prepSaver.schedule();renderPrep();return}
    case "fs-pick": pickFood(+b.dataset.v); return;
    case "fs-back": srch.res=null; renderSearch(); return;
    case "fs-stop": if(srch.ctl)srch.ctl.abort(); srch.ctl=null; srch.loading=false; renderSearch(); return;
    case "fs-go": runSearch(b.dataset.v); return;
    case "fs-amt": srch.grams=+b.dataset.v; srch.added=""; renderSearch(); return;
    case "fs-add": {const r=srch.res;if(!r)return;const g=Math.max(0,+srch.grams||0),f=g/100,P=r.per100g;const en=mealDay(mealDate||todayKey(),true);
      const sel=document.getElementById("fs-meal");let ml=en.meals.find(x=>x.id===(sel?sel.value:srch.addTo))||en.meals[0];
      if(!ml){ml={id:uid(),name:"Snacks",c:"",p:"",f:""};en.meals.push(ml)}
      const add=(q,v)=>{ml[q]=Math.round(((+ml[q]||0)+(+v||0)*f)*10)/10};add("c",P.carbs);add("p",P.protein);add("f",P.fat);
      srch.addTo=ml.id;srch.added="Added to "+(ml.name||"meal");scheduleMeals(mealDate||todayKey());renderNutrition();return}
    case "meal-prev": mealDate=dateKey(addDays(parseKey(mealDate),-1)); mealArmed=null; renderNutrition(); return;
    case "meal-next": mealDate=dateKey(addDays(parseKey(mealDate),1)); mealArmed=null; renderNutrition(); return;
    case "meal-today": mealDate=todayKey(); renderNutrition(); return;
    case "meal-go": mealDate=b.dataset.v; renderNutrition(); return;
    case "meal-type": {const en=mealDay(mealDate,true);en.type=en.type===b.dataset.v?null:b.dataset.v;scheduleMeals(mealDate);renderNutrition();return}
    case "meal-add": {const en=mealDay(mealDate,true);const nm={id:uid(),name:"",c:"",p:"",f:""};en.meals.push(nm);scheduleMeals(mealDate);renderNutrition();const n=document.getElementById("mname-"+nm.id);n&&n.focus();return}
    case "meal-del": {const en=mealDay(mealDate,true);en.meals=en.meals.filter(x=>x.id!==b.dataset.meal);scheduleMeals(mealDate);renderNutrition();return}
    case "meal-copy": {const y=meals[dateKey(addDays(parseKey(mealDate),-1))];
      if(!y||!y.meals.some(mealHas)){b.textContent="Nothing logged yesterday";setTimeout(()=>{if(b.isConnected)b.textContent="Same as yesterday"},1800);return}
      const cur=meals[mealDate];
      if(cur&&cur.meals.some(mealHas)&&mealArmed!=="copy"){mealArmed="copy";clearTimeout(mealTimer);mealTimer=setTimeout(()=>{mealArmed=null;if(tab==="nutrition")renderNutrition()},4000);renderNutrition();return}
      mealArmed=null;const en=mealDay(mealDate,true);en.meals=y.meals.map(m=>({id:uid(),name:m.name,c:m.c,p:m.p,f:m.f}));scheduleMeals(mealDate);renderNutrition();return}
    case "nut-sex": nut.sex=nut.sex===b.dataset.v?"":b.dataset.v; nutSaver.schedule(); renderNutrition(); return;
    case "nut-keep": nut.example=false; nutSaver.schedule(); renderNutrition(); return;
    case "nut-day": {const dd=plan.days.find(x=>x.id===b.dataset.day);if(!dd)return;nut.schedule[dd.id]=b.dataset.v;nutSaver.schedule();renderNutrition();return}
    case "nut-suggest": {if(!nutArmed){nutArmed=true;clearTimeout(nutTimer);nutTimer=setTimeout(()=>{nutArmed=false;if(tab==="nutrition")renderNutrition()},4000);renderNutrition();return}
      nutArmed=false;clearTimeout(nutTimer);const kg=latestBwKg();if(!kg)return;const P=r5(2.2*kg);
      nut.types={low:{c:r5(1.5*kg),p:P,f:r5(1.0*kg)},med:{c:r5(3*kg),p:P,f:r5(0.8*kg)},high:{c:r5(4.5*kg),p:P,f:r5(0.6*kg)}};nut.example=false;nutSaver.schedule();renderNutrition();return}
    case "wk-prev": weekSel=dateKey(addDays(parseKey(weekSel),-7)); renderProgress(); return;
    case "wk-next": weekSel=dateKey(addDays(parseKey(weekSel),7)); renderProgress(); return;
    case "pick-week": weekSel=b.dataset.v; renderProgress(); return;
    case "metric": metric=b.dataset.v; ls.set(LS_METRIC,metric); renderProgress(); return;
    case "select-day": sel=b.dataset.day; ls.set(LS_SEL,sel); armed=null; renderWorkout(); return;
    case "add-day": {const nd=day("","","train",0,[["",3,""]],"");plan.days.push(nd);sel=nd.id;break}
    case "del-day": if(!confirm2("del-day",()=>{const i=plan.days.indexOf(d);plan.days.splice(i,1);if(!plan.days.length)plan.days.push(day("Mon","","train",0,[["",3,""]]));sel=plan.days[Math.max(0,i-1)].id}))return; break;
    case "set-type": d.type=b.dataset.v; if(d.type==="rest")d.optional=false; if(d.type==="train"&&!d.exercises.length)d.exercises.push(ex("",3,"")); break;
    case "toggle-ex": e.open=!e.open; break;
    case "add-ex": {const ne=ex("",3,"");ne.open=true;d.exercises.push(ne);planSaver.schedule();renderWorkout();const n=document.getElementById("exname-"+ne.id);n&&n.focus();return}
    case "del-ex": if(!confirm2("del-ex-"+exId,()=>{d.exercises=d.exercises.filter(x=>x.id!==exId)}))return; break;
    case "ex-up": case "ex-down": {const i=d.exercises.indexOf(e),j=act==="ex-up"?i-1:i+1;if(j<0||j>=d.exercises.length)return;[d.exercises[i],d.exercises[j]]=[d.exercises[j],d.exercises[i]];break}
    case "add-set": {const last=e.sets[e.sets.length-1];e.sets.push({reps:last?last.reps:"",weight:last?last.weight:"",done:false});break}
    case "del-set": {const i=+b.dataset.i; if(e.sets[i].done)logSet(d,e,i,false); e.sets.splice(i,1); break}
    case "unit": plan.unit=b.dataset.v; break;
    case "keep-sample": plan.example=false; break;
    case "start-blank": if(!confirm2("blank",()=>{const o=plan.orm;plan=blankPlan();plan.orm=o;sel=plan.days[0].id}))return; break;
    case "load-sample": if(!confirm2("sample",()=>{const u=plan.unit,o=plan.orm;plan=samplePlan();plan.unit=u;plan.orm=o;const mm=plan.days.find(x=>x.tag===todayTag);sel=(mm||plan.days[0]).id}))return; break;
    case "reset-checks": if(!confirm2("reset",()=>{plan.days.forEach(x=>x.exercises.forEach(y=>y.sets.forEach(s=>s.done=false)))}))return; break;
    case "daily-inc": {const k=todayKey(),t=todayEntry();t[b.dataset.k]=Math.min(999,(+t[b.dataset.k]||0)+10);daily.log[k]=t;pruneDaily();dailySaver.schedule();renderDaily();return}
    case "daily-reset": {daily.log[todayKey()]={push:0,pull:0,legs:0};dailySaver.schedule();renderDaily();return}
    default: return;
  }
  planSaver.schedule(); renderWorkout();
});
app.addEventListener("change",ev=>{
  const t=ev.target, c=t.dataset.c;
  if(t.dataset.f==="fs-meal"){srch.addTo=t.value;srch.added="";return}
  if(t.dataset.f==="restore-file"){const f=t.files&&t.files[0];if(f)readBackup(f);t.value="";return}
  if(t.dataset.f==="ci-file"){const f=t.files&&t.files[0];if(f)uploadPhoto(f,t.dataset.pose);t.value="";return}
  if(t.dataset.f==="act-type"){const a=actFor(actDate||todayKey());const c=a.cardio.find(x=>x.id===t.dataset.id);if(c){c.t=t.value;prepSaver.schedule()}return}
  if(t.dataset.f==="pr-show"){prep.showDate=t.value;if(prep.showDate&&!prep.startDate){const kg=avgAt(todayKey())||latestBwKg();if(kg){prep.startDate=todayKey();prep.startKg=kg}}prepSaver.schedule();setTodayLine();renderPrep();return}
  if(t.dataset.f==="ex-base"||t.dataset.f==="ex-lift"){const {e}=findEx(t.dataset.ex);if(!e)return;if(t.dataset.f==="ex-base")e.base=t.value;else e.lift=t.value;applyLoad(e);planSaver.schedule();renderWorkout();return}
  if(!c)return;
  if(c==="optional"){curDay().optional=t.checked}
  else{const {d,e}=findEx(t.dataset.ex);if(!e)return;
    if(c==="set-done"){const i=+t.dataset.i;e.sets[i].done=t.checked;logSet(d,e,i,t.checked)}
    if(c==="ex-done"){e.sets.forEach((s,i)=>{if(s.done!==t.checked){s.done=t.checked;logSet(d,e,i,t.checked)}})}
  }
  planSaver.schedule(); renderWorkout();
});
app.addEventListener("input",ev=>{
  const t=ev.target, f=t.dataset.f; if(!f)return;
  const d=curDay();
  if(f==="fs-q"){srch.q=t.value;return}
  if(f==="pr-tgt"){prep.targetW=t.value.replace(/[^\d.]/g,"").slice(0,6);if(!prep.startDate&&prep.showDate){const kg=avgAt(todayKey())||latestBwKg();if(kg){prep.startDate=todayKey();prep.startKg=kg}}prepSaver.schedule();rerender(renderPrep);return}
  if(f==="ci-waist"||f==="ci-notes"){const ci=ciFor(todayKey(),true);if(f==="ci-waist"){ci.waist=t.value.replace(/[^\d.]/g,"").slice(0,6)}else ci.notes=t.value;prepSaver.schedule();if(f==="ci-waist")rerender(renderPrep);return}
  if(f==="act-steps"){const a=actFor(actDate||todayKey());a.steps=t.value.replace(/\D/g,"").slice(0,6);prepSaver.schedule();rerender(renderPrep);return}
  if(f==="act-min"){const a=actFor(actDate||todayKey());const c=a.cardio.find(x=>x.id===t.dataset.id);if(c){c.m=t.value.replace(/\D/g,"").slice(0,4);prepSaver.schedule();rerender(renderPrep)}return}
  if(f==="pose-min"){const k=actDate||todayKey();const v=t.value.replace(/\D/g,"").slice(0,3);if(v==="")delete prep.posing[k];else prep.posing[k]=+v;prepSaver.schedule();rerender(renderPrep);return}
  if(f==="pose-tgt"){prep.posingTarget=t.value.replace(/\D/g,"").slice(0,3);prepSaver.schedule();rerender(renderPrep);return}
  if(f==="pr-st"||f==="pr-ct"){const v=t.value.replace(/\D/g,"").slice(0,6);if(f==="pr-st")prep.stepTarget=v;else prep.cardioTarget=v;prepSaver.schedule();rerender(renderPrep);return}
  if(f==="orm-v"||f==="orm-name"||f==="tm-pct"){
    if(f==="tm-pct"){const v=t.value.replace(/[^\d.]/g,"");plan.orm.tmPct=v===""?"":Math.min(100,parseFloat(v)||0)}
    else{const L=plan.orm.lifts.find(x=>x.id===t.dataset.id);if(!L)return;if(f==="orm-name")L.name=t.value;else L.v=t.value.replace(/[^\d.]/g,"").slice(0,6)}
    if(f!=="orm-name")applyAllLoads();planSaver.schedule();renderWorkout();return}
  if(f==="fs-g"){const v=t.value.replace(/[^\d.]/g,"");srch.grams=v===""?"":Math.min(5000,parseFloat(v)||0);srch.added="";rerender(renderSearch);return}
  if(f==="meal-name"||f==="meal-mac"){const en=mealDay(mealDate,true);const ml=en.meals.find(x=>x.id===t.dataset.meal);if(!ml)return;
    if(f==="meal-name")ml.name=t.value;
    else{const v=t.value.replace(/[^\d.]/g,"");ml[t.dataset.k]=v===""?"":Math.min(1000,parseFloat(v)||0)}
    scheduleMeals(mealDate);if(f==="meal-mac")rerender(renderNutrition);return}
  if(f==="nut"){const v=t.value.replace(/[^\d.]/g,"");nut.types[t.dataset.t][t.dataset.m]=v===""?"":Math.min(2000,parseFloat(v)||0);nut.example=false;nutSaver.schedule();rerender(renderNutrition);return}
  if(f==="bw"){const v=parseFloat(t.value.replace(/[^\d.]/g,""));const k=todayKey();if(v>0)nut.bw[k]={v:v,u:plan.unit};else delete nut.bw[k];const ks=Object.keys(nut.bw).sort();while(ks.length>400)delete nut.bw[ks.shift()];if(v>0&&prep.showDate&&!prep.startDate){prep.startDate=k;prep.startKg=toKg(v,plan.unit);prepSaver.schedule()}nutSaver.schedule();if(tab==="prep")rerender(renderPrep);else rerender(renderNutrition);return}
  if(f==="daily"){const k=todayKey(),en=todayEntry();const v=parseInt(t.value.replace(/\D/g,""),10);en[t.dataset.k]=isNaN(v)?0:Math.min(999,v);daily.log[k]=en;pruneDaily();dailySaver.schedule();
    const row=t.closest(".drow");const bar=row&&row.querySelector(".dbar i");if(bar)bar.style.width=Math.min(100,en[t.dataset.k])+"%";return}
  if(f==="day-name"){d.name=t.value;const n=document.getElementById("chipname-"+d.id);if(n)n.textContent=d.name||(d.type==="rest"?"Rest":"Untitled")}
  else if(f==="day-tag"){d.tag=t.value;const chip=document.querySelector('[data-day="'+d.id+'"] .tag span');if(chip)chip.textContent=d.tag||"—"}
  else if(f==="day-notes"){d.notes=t.value}
  else{const {e}=findEx(t.dataset.ex);if(!e)return;
    if(f==="ex-name"){e.name=t.value;syncLogged(e,null)}
    if(f==="ex-note")e.note=t.value;
    if(f==="set-reps"){e.sets[+t.dataset.i].reps=t.value;const s=document.getElementById("sum-"+e.id);if(s)s.textContent=exSummary(e);syncLogged(e,+t.dataset.i)}
    if(f==="set-weight"){const st=e.sets[+t.dataset.i];st.weight=t.value;st.auto=false;t.classList.remove("auto");syncLogged(e,+t.dataset.i)}
    if(f==="ex-pct"){e.pct=t.value.replace(/[^\d.]/g,"").slice(0,5);applyLoad(e);planSaver.schedule();renderWorkout();return}
  }
  planSaver.schedule();
});
app.addEventListener("focusout",ev=>{if(ev.target.dataset&&ev.target.dataset.f==="daily")renderDaily()});
function pruneDaily(){const keys=Object.keys(daily.log).sort();while(keys.length>400)delete daily.log[keys.shift()]}

setTodayLine(); renderWorkout(); renderDaily(); showTab(tab);
renderSearch(); boot();
})();
